services:
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    environment:
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - CORS_ORIGINS=http://localhost:3000
      - DAILY_ANALYSIS_LIMIT=5
      - QUOTA_WINDOW_HOURS=24
    ports:
      - "8000:8000"
  demo_app:
    build:
      context: demo_app
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
